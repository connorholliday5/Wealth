name: Wealth
options:
  bundleIdPrefix: com.connorholliday.wealth
  deploymentTarget:
    iOS: "17.0"
packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios
    from: 5.6.0
targets:
  Wealth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wealth
    dependencies:
      - package: LinkKit
        product: LinkKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.connorholliday.wealth.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wealth
