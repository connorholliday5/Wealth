name: Wealth
options:
  bundleIdPrefix: com.connorholliday.wealth
  deploymentTarget:
    iOS: "17.0"
packages:
  LinkKit:
    url: https://github.com/plaid/plaid-link-ios
    from: 5.6.0
targets:
  Wealth:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Wealth
    dependencies:
      - package: LinkKit
        product: LinkKit
      # Note: FoundationModels (on-device AI, iOS 26+) is NOT linked here on
      # purpose. The Swift files that use it are wrapped in
      # `#if canImport(FoundationModels)`, so on a new-enough Xcode the import
      # autolinks the framework, and on older Xcode/SDKs the app builds without
      # the on-device chat (the cloud advisor covers it). Explicitly listing the
      # framework would break the build on toolchains that don't ship it.
    # xcodegen writes this Info.plist at generate time. NSAllowsLocalNetworking
    # lets a physical iPhone reach the Wealth server on your Mac over plain
    # http on the same Wi-Fi (e.g. http://192.168.x.x:8787) — iOS blocks
    # non-HTTPS to anything except localhost otherwise. Internet servers still
    # require HTTPS.
    info:
      path: Wealth/Info.plist
      properties:
        CFBundleDisplayName: Wealth
        UILaunchScreen: {}
        NSFaceIDUsageDescription: "Wealth uses Face ID to keep your accounts and balances private."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.connorholliday.wealth.app
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
    scheme:
      testTargets:
        - WealthTests
  WealthTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: WealthTests
    dependencies:
      - target: Wealth
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.connorholliday.wealth.tests
        SWIFT_VERSION: "5.0"
